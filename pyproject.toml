[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adityacli"
version = "0.1.0"
dependencies = [
    "openai>=2.38.0",
    "typer>=0.26.3",
    "rich>=15.0.0",
    "pydantic>=2.13.4",
    "ddgs>=9.5.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
adityacli = "adityacli.cli:app"